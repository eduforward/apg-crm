# Firestore 권한 규칙 자동 배포
# firebase/firestore.rules 가 main 에 올라오면 Firebase(apg-crm-e3d36)에 그대로 배포합니다.
# 인증: 키 없음(Workload Identity 제휴). 이 저장소의 main 브랜치 실행만 허용
#   서비스 계정 역할: Firebase Rules Admin, Service Usage Consumer
# 상담신청 수신 함수(firebase/functions)는 여기서 배포하지 않습니다.
name: Firebase rules deploy

on:
  push:
    branches: [main]
    paths:
      - firebase/firestore.rules
      - firebase/firebase.json
      - .github/workflows/firebase-rules.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/605445699906/locations/global/workloadIdentityPools/github/providers/apg-crm
          service_account: github-deploy@apg-crm-e3d36.iam.gserviceaccount.com
      - name: Deploy Firestore rules
        working-directory: firebase
        run: npx --yes firebase-tools@15 deploy --only firestore:rules --project apg-crm-e3d36 --non-interactive
